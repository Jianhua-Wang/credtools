site_name: CREDTOOLS
site_url: https://Jianhua-Wang.github.io/credtools
repo_url: https://github.com/Jianhua-Wang/credtools
repo_name: Jianhua-Wang/credtools

nav:
  - Home: index.md
  - Getting Started:
      - Overview: getting-started/index.md
      - Core Concepts: getting-started/concepts.md
      - Installation: getting-started/installation.md
      - Quickstart: getting-started/quickstart.md
  - Tutorials:
      - Overview: tutorials/index.md
      - Raw GWAS to Results: tutorials/from-raw-gwas-to-results.md
      - Existing Loci List: tutorials/run-an-existing-loci-list.md
      - Pre-Generated LD: tutorials/pre-generated-ld-ukb-1kg.md
      - Single-Ancestry Fine-Mapping: tutorials/single-ancestry-finemapping.md
      - Multi-Ancestry Fine-Mapping: tutorials/multi-ancestry-finemapping.md
      - Visualize QC and Results: tutorials/visualize-qc-and-results.md
  - Guides:
      - Input Files: guides/input-files.md
      - Output Files: guides/output-files.md
      - Known Limitations: guides/known-limitations.md
      - External Tools and Environment: guides/external-tools.md
      - Choosing a Meta Method: guides/choosing-meta-method.md
      - Choosing a Fine-Mapping Tool: guides/choosing-finemapping-tool.md
      - Fine-Mapping Tool Requirements: guides/finemapping-tool-requirements.md
      - Quality Control: guides/quality-control.md
      - Plot Gallery: guides/plot-gallery.md
      - Batch and HPC: guides/batch-hpc.md
      - Troubleshooting: guides/troubleshooting.md
  - Reference:
      - File Schemas: reference/file-schemas.md
      - QC Metrics Dictionary: reference/qc-metrics.md
      - CLI:
          - Overview: reference/cli/index.md
          - munge: reference/cli/munge.md
          - chunk: reference/cli/chunk.md
          - prepare: reference/cli/prepare.md
          - meta: reference/cli/meta.md
          - qc: reference/cli/qc.md
          - finemap: reference/cli/finemap.md
          - pipeline: reference/cli/pipeline.md
          - plot: reference/cli/plot.md
      - API:
          - Overview: reference/api/index.md
          - Core Objects: reference/api/core.md
          - Preprocessing: reference/api/preprocessing.md
          - Meta-Analysis: reference/api/meta.md
          - Quality Control: reference/api/qc.md
          - Fine-Mapping: reference/api/finemapping.md
          - Plotting: reference/api/plotting.md
          - Cookbook: reference/api/cookbook.md
  - Changelog: changelog.md
  - Contributing: contributing.md

theme:
  name: material
  language: en
  palette:
    scheme: preference
    primary: indigo
    accent: indigo
  features:
    - navigation.indexes
    - navigation.instant
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - toc.follow
    - content.code.copy

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - meta
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.emoji
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.magiclink
  - pymdownx.snippets:
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist

plugins:
  - search:
      lang: en
  - mkdocstrings:
      handlers:
        python:
          inventories:
            - https://docs.python.org/3/objects.inv
            - https://mkdocstrings.github.io/autorefs/objects.inv
          options:
            docstring_style: numpy
            docstring_options:
              ignore_init_summary: true
            merge_init_into_class: true
            show_submodules: true
